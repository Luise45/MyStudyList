name: CI Pipeline (Testing & Coverage)

# Trigger: Whenever code is pushed or a pull request is created
on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # JOB 1: Frontend Tests (Angular)
  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend # IMPORTANT: Tell GitHub to go into the frontend directory
    steps:
      # 1. Download code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Install Node.js (with caching for faster builds!)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # IMPORTANT: Adjust this to your Node.js version 
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      # 3. Install Dependencies
      - name: Install Dependencies
        run: npm ci

      # 4. Run tests + generate coverage report
      - name: Run Angular Tests with Coverage
        run: npx ng test --watch=false --browsers=ChromeHeadless --no-progress --code-coverage

      # 5. Upload Coverage Report as Artifact (So that it can be downloaded in GitHub)
      - name: Upload Coverage Report
        if: always() # Also runs when tests fail
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: ./frontend/coverage/ 
          retention-days: 7  # Keep these uploaded files for 7 days, and then automatically delete them to free up storage space.
          
      # 6. Upload frontend coverage to Codecov
      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # Path from the ROOT directory!
          files: ./frontend/coverage/frontend/lcov.info # Path to Karma coverage file
          flags: frontend
          fail_ci_if_error: false # So that the pipeline does not break if Codecov is down
 
   # JOB 2: Backend Tests
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    # 1. Download code
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./backend/package-lock.json

      # 3. Install Dependencies
      - name: Install Dependencies
        run: npm ci

      # 4. Run backend tests and check coverage sequentially
      - name: Run Backend Tests and Check Coverage
        run: npm run test:coverage -- --runInBand

      # 5. Upload backend coverage to Codecov
      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info # Path to Jest coverage file
          flags: backend
          fail_ci_if_error: false

  e2e-tests:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      MONGO_TEST_URI: ${{ secrets.MONGO_TEST_URI }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

    # Backend needs its dependencies so the server can run
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

    # Playwright is installed in the project root
      - name: Install E2E Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run E2E Tests
        run: npx playwright test
            


