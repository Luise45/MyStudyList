name: CI Pipeline (Testing)

# Trigger: Whenever code is pushed or a pull request is created
on:
  push:
    branches: [ "main", "dev", "feature/setup-ci-and-testing" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # JOB 1: Frontend Tests (Angular)
  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend # IMPORTANT: Tell GitHub to go into the frontend directory
    steps:
      # 1. Download code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Install Node.js (with caching for faster builds!)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # IMPORTANT: Adjust this to your Node.js version (specified in package.json "engines" or simply 20)
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      # 3. Install Dependencies
      - name: Install Dependencies
        run: npm ci

      # 4. Run Tests (The exact same command that works locally!)
      - name: Run Angular Tests
        run: npx ng test --watch=false --browsers=ChromeHeadless --no-progress

  # JOB 2: Backend Tests
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    # 1. Download code
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./backend/package-lock.json

      # 3. Install Dependencies
      - name: Install Dependencies
        run: npm ci

      # 4. Run backend tests and check coverage sequentially
      - name: Run Backend Tests and Check Coverage
        run: npm run test:coverage -- --runInBand

